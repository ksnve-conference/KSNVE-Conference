<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">개선 우선순위 | 실행 과제 도출 예시</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">개선 후보: 점수 부족분 × 유효 응답 비율</text><text x="55" y="255" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">검토 지수 = max(0, 4.0 − 평균) × (유효 응답 수 ÷ 700). 점수가 낮고 응답 범위가 넓은 항목을 먼저 살펴봅니다.</text><text x="55" y="285" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">이 지수는 이번 시안의 정렬 규칙입니다. 중요도·인과효과·통계적 유의성을 뜻하지 않습니다.</text><rect x="55" y="312" width="1290" height="43" rx="6" fill="#eaf3f8"/><text x="75" y="341" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">순위 / 개선 후보</text><text x="550" y="341" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">평균</text><text x="680" y="341" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">기준 부족분</text><text x="850" y="341" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">유효 응답 비율</text><text x="1090" y="341" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">검토 지수</text><text x="75" y="393" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">1. 교통·접근성</text><text x="550" y="393" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3.66</text><text x="680" y="393" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">0.34</text><text x="850" y="393" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">100% · 700명</text><rect x="1090" y="375" width="149.99999999999994" height="21" rx="4" fill="#ce8330"/><text x="1315" y="393" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">0.340</text><text x="75" y="452" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">2. 주변 숙소</text><text x="550" y="452" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3.89</text><text x="680" y="452" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">0.11</text><text x="850" y="452" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">80% · 560명</text><rect x="1090" y="434" width="39.52941176470592" height="21" rx="4" fill="#ce8330"/><text x="1315" y="452" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">0.090</text><text x="75" y="511" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3. 질의응답·토론</text><text x="550" y="511" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3.94</text><text x="680" y="511" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">0.06</text><text x="850" y="511" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">95% · 665명</text><rect x="1090" y="493" width="26.40441176470595" height="21" rx="4" fill="#ce8330"/><text x="1315" y="511" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">0.060</text><text x="75" y="570" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">4. 포스터 운영</text><text x="550" y="570" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3.95</text><text x="680" y="570" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">0.05</text><text x="850" y="570" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">80% · 560명</text><rect x="1090" y="552" width="17.647058823529346" height="21" rx="4" fill="#ce8330"/><text x="1315" y="570" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">0.040</text><text x="75" y="629" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">5. 식사·점심</text><text x="550" y="629" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">3.97</text><text x="680" y="629" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">0.03</text><text x="850" y="629" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">90% · 630명</text><rect x="1090" y="611" width="13.102941176470555" height="21" rx="4" fill="#ce8330"/><text x="1315" y="629" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">0.030</text><rect x="55" y="702" width="625" height="209" rx="12" fill="#f3f7fa"/><text x="75" y="737" font-size="22" fill="#0674aa" font-weight="700" text-anchor="start">간략 해석 · 조치 검토 예시</text><text x="75" y="775" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">① 교통·접근성: 이동 안내와 교통편 보완 검토</text><text x="75" y="807" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">② 주변 숙소: 숙박 안내·가격·접근성 의견 확인</text><text x="75" y="839" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">③ 질의응답·토론: 토론 시간과 진행 방식 검토</text><text x="75" y="871" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">최종 우선순위는 비용·실행 가능성·자유 의견을 함께 판단</text><rect x="705" y="702" width="640" height="209" rx="12" fill="#fff5df"/><text x="725" y="737" font-size="22" fill="#97621b" font-weight="700" text-anchor="start">중요도–만족도 분석 활용 방법</text><text x="725" y="775" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">개인별 응답이 모이면 항목 점수와 전반 만족도의</text><text x="725" y="807" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">상관관계를 구해 낮은 만족도·높은 연관성 항목을 확인합니다.</text><text x="725" y="839" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">다음 쪽은 설명용 예시이며 실제 응답의 계산 결과가 아닙니다.</text><text x="725" y="871" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">상관관계는 인과관계가 아니며 유효 응답 수도 함께 봅니다.</text></g></svg>