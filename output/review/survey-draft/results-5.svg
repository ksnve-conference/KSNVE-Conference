<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">주요 결과 | 모의 분석 결과</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">01  주요 결과</text><rect x="55" y="242" width="306" height="116" rx="14" fill="#edf5fa"/><text x="75" y="270" font-size="18" fill="#607689" font-weight="400" text-anchor="start">전반 만족도</text><text x="75" y="316" font-size="38" fill="#0674aa" font-weight="700" text-anchor="start">4.20</text><text x="75" y="342" font-size="15" fill="#607689" font-weight="400" text-anchor="start">5점 척도 · n=700</text><rect x="383" y="242" width="306" height="116" rx="14" fill="#edf5fa"/><text x="403" y="270" font-size="18" fill="#607689" font-weight="400" text-anchor="start">긍정 응답률</text><text x="403" y="316" font-size="38" fill="#0674aa" font-weight="700" text-anchor="start">85%</text><text x="403" y="342" font-size="15" fill="#607689" font-weight="400" text-anchor="start">전반 만족도 4·5점</text><rect x="711" y="242" width="306" height="116" rx="14" fill="#edf5fa"/><text x="731" y="270" font-size="18" fill="#607689" font-weight="400" text-anchor="start">발표 수준</text><text x="731" y="316" font-size="38" fill="#0674aa" font-weight="700" text-anchor="start">4.28</text><text x="731" y="342" font-size="15" fill="#607689" font-weight="400" text-anchor="start">5점 척도 · n=665</text><rect x="1039" y="242" width="306" height="116" rx="14" fill="#edf5fa"/><text x="1059" y="270" font-size="18" fill="#607689" font-weight="400" text-anchor="start">재참가 의향</text><text x="1059" y="316" font-size="38" fill="#0674aa" font-weight="700" text-anchor="start">86%</text><text x="1059" y="342" font-size="15" fill="#607689" font-weight="400" text-anchor="start">‘예’ 602명 / 700명</text><text x="55" y="405" font-size="23" fill="#16374d" font-weight="700" text-anchor="start">참가 유형</text><circle cx="145" cy="519" r="72" fill="none" stroke="#126f9d" stroke-width="25" stroke-dasharray="217.1468842161265 235.2424579008037" stroke-dashoffset="0" transform="rotate(-90 145 519)"/><rect x="260" y="444" width="13" height="13" rx="3" fill="#126f9d"/><text x="284" y="457" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">학생</text><text x="645" y="457" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">48% · 336명</text><circle cx="145" cy="519" r="72" fill="none" stroke="#36a5b8" stroke-width="25" stroke-dasharray="54.286721054031624 398.1026210628986" stroke-dashoffset="-217.1468842161265" transform="rotate(-90 145 519)"/><rect x="260" y="479" width="13" height="13" rx="3" fill="#36a5b8"/><text x="284" y="492" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">학계(비학생)</text><text x="645" y="492" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">12% · 84명</text><circle cx="145" cy="519" r="72" fill="none" stroke="#e9b54b" stroke-width="25" stroke-dasharray="67.85840131753953 384.5309407993907" stroke-dashoffset="-271.4336052701581" transform="rotate(-90 145 519)"/><rect x="260" y="514" width="13" height="13" rx="3" fill="#e9b54b"/><text x="284" y="527" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">연구계</text><text x="645" y="527" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">15% · 105명</text><circle cx="145" cy="519" r="72" fill="none" stroke="#7a8faa" stroke-width="25" stroke-dasharray="113.09733552923255 339.2920065876977" stroke-dashoffset="-339.29200658769764" transform="rotate(-90 145 519)"/><rect x="260" y="549" width="13" height="13" rx="3" fill="#7a8faa"/><text x="284" y="562" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">산업계</text><text x="645" y="562" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">25% · 175명</text><text x="145" y="519" font-size="30" fill="#16374d" font-weight="700" text-anchor="middle">700</text><text x="145" y="548" font-size="15" fill="#607689" font-weight="400" text-anchor="middle">가상 응답</text><text x="735" y="405" font-size="23" fill="#16374d" font-weight="700" text-anchor="start">주요 역할</text><circle cx="825" cy="519" r="72" fill="none" stroke="#126f9d" stroke-width="25" stroke-dasharray="180.95573684677208 271.4336052701581" stroke-dashoffset="0" transform="rotate(-90 825 519)"/><rect x="940" y="444" width="13" height="13" rx="3" fill="#126f9d"/><text x="964" y="457" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">청중</text><text x="1325" y="457" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">40% · 280명</text><circle cx="825" cy="519" r="72" fill="none" stroke="#36a5b8" stroke-width="25" stroke-dasharray="158.3362697409256 294.05307237600465" stroke-dashoffset="-180.95573684677208" transform="rotate(-90 825 519)"/><rect x="940" y="479" width="13" height="13" rx="3" fill="#36a5b8"/><text x="964" y="492" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">구두 발표</text><text x="1325" y="492" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">35% · 245명</text><circle cx="825" cy="519" r="72" fill="none" stroke="#e9b54b" stroke-width="25" stroke-dasharray="67.85840131753953 384.5309407993907" stroke-dashoffset="-339.29200658769764" transform="rotate(-90 825 519)"/><rect x="940" y="514" width="13" height="13" rx="3" fill="#e9b54b"/><text x="964" y="527" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">포스터 발표</text><text x="1325" y="527" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">15% · 105명</text><circle cx="825" cy="519" r="72" fill="none" stroke="#7a8faa" stroke-width="25" stroke-dasharray="22.61946710584651 429.76987501108374" stroke-dashoffset="-407.15040790523716" transform="rotate(-90 825 519)"/><rect x="940" y="549" width="13" height="13" rx="3" fill="#7a8faa"/><text x="964" y="562" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">좌장</text><text x="1325" y="562" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">5% · 35명</text><circle cx="825" cy="519" r="72" fill="none" stroke="#9caebc" stroke-width="25" stroke-dasharray="22.61946710584651 429.76987501108374" stroke-dashoffset="-429.7698750110837" transform="rotate(-90 825 519)"/><rect x="940" y="584" width="13" height="13" rx="3" fill="#9caebc"/><text x="964" y="597" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">전시 참가</text><text x="1325" y="597" font-size="18" fill="#16374d" font-weight="600" text-anchor="end">5% · 35명</text><text x="825" y="519" font-size="30" fill="#16374d" font-weight="700" text-anchor="middle">700</text><text x="825" y="548" font-size="15" fill="#607689" font-weight="400" text-anchor="middle">가상 응답</text><text x="55" y="652" font-size="17" fill="#607689" font-weight="400" text-anchor="start">학계 전체 60% 중 학생 80% → 전체 학생 48%, 비학생 학계 12%.</text><rect x="55" y="685" width="1290" height="219" rx="12" fill="#f3f7fa"/><text x="78" y="722" font-size="22" fill="#0674aa" font-weight="700" text-anchor="start">해석 예시</text><text x="78" y="762" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">• 전반 만족도 4.20점과 재참가 의향 86%는 예시로 설정한 긍정적 평가 시나리오입니다.</text><text x="78" y="796" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">• 발표 수준 4.28점에 비해 교통·접근성은 3.66점으로, 접근성 개선을 검토하는 보고서 예시입니다.</text><text x="78" y="830" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">• 학생 비중이 48%이므로 실제 조사에서는 학생·비학생 결과를 나누어 확인하는 것이 좋습니다.</text></g></svg>