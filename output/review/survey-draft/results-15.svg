<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">상세 분석 ③ | 불만족 응답 집중 분석</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">낮은 점수 응답을 따로 보아 평균의 한계 보완</text><text x="55" y="253" font-size="18" fill="#607689" font-weight="400" text-anchor="start">불만족률 = 1·2점 응답 수 ÷ 유효 응답 수. ‘해당 없음’ 제외 · 학술·운영·서비스 13개 항목 비교.</text><text x="55" y="300" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">항목</text><text x="370" y="300" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">불만족률 (막대 범위 0~20%)</text><text x="950" y="300" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">불만족 / 유효 응답</text><text x="1260" y="300" font-size="18" fill="#16374d" font-weight="700" text-anchor="start">평균</text><text x="55" y="340" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">교통·접근성</text><rect x="370" y="324" width="420" height="20" rx="4" fill="#f5eee8"/><rect x="370" y="324" width="294.0" height="20" rx="4" fill="#cc8451"/><text x="880" y="340" font-size="19" fill="#a35825" font-weight="600" text-anchor="end">14.0%</text><text x="1085" y="340" font-size="18" fill="#16374d" font-weight="400" text-anchor="middle">98 / 700명</text><text x="1300" y="340" font-size="18" fill="#16374d" font-weight="400" text-anchor="end">3.66</text><text x="55" y="379" font-size="18" fill