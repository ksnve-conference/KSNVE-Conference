<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">개선 우선순위 | 중요도–만족도 4사분위</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 지정한 구성비 외 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">낮은 만족도 · 높은 중요도 → 우선 개선 검토</text><text x="55" y="253" font-size="17" fill="#607689" font-weight="400" text-anchor="start">가로축: 기존 모의 만족도 / 세로축: 시연용 중요도 가정값(1~5). 중요도를 실제 측정하거나 추정한 결과가 아닙니다.</text><rect x="110" y="305" width="360.0" height="255.0" rx="0" fill="#fff0e5"/><rect x="470.0" y="305" width="360.0" height="255.0" rx="0" fill="#e9f4fa"/><rect x="110" y="560.0" width="360.0" height="255.0" rx="0" fill="#f2f3f5"/><rect x="470.0" y="560.0" width="360.0" height="255.0" rx="0" fill="#eef6ef"/><path d="M110.0,305 V815" stroke="#cbd8e1" stroke-dasharray="5 5"/><text x="110.0" y="843" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">3.5</text><path d="M290.0,305 V815" stroke="#cbd8e1" stroke-dasharray="5 5"/><text x="290.0" y="843" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">3.75</text><path d="M470.0,305 V815" stroke="#cbd8e1" stroke-dasharray="5 5"/><text x="470.0" y="843" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">4</text><path d="M650.0,305 V815" stroke="#cbd8e1" stroke-dasharray="5 5"/><text x="650.0" y="843" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">4.25</text><path d="M