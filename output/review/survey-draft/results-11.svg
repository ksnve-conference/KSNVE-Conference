="514.0" font-size="15" fill="white" font-weight="700" text-anchor="middle">11</text><text x="890" y="714" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">11  앱 도움 정도</text><text x="1325" y="714" font-size="17" fill="#16374d" font-weight="500" text-anchor="end">4.31 / 3.4</text><rect x="875" y="765" width="470" height="134" rx="10" fill="#f3f7fa"/><text x="892" y="794" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">* 중요도와 구분선 3.0은 시연용 가정입니다.</text><text x="892" y="822" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">예시상 교통·접근성, 질의응답·토론,</text><text x="892" y="850" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">포스터 운영이 왼쪽 위에 위치합니다.</text><text x="892" y="878" font-size="17" fill="#16374d" font-weight="400" text-anchor="start">실제 개선 순위로 해석하지 않습니다.</text><text x="55" y="925" font-size="17" fill="#607689" font-weight="400" text-anchor="start">실제 조사에서는 중요도를 별도로 질문하거나 개인별 응답의 전반 만족도와 연관성을 분석해야 합니다.</text></g></svg>