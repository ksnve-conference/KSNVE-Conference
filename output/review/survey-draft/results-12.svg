<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">이용·참여 응답 비율과 만족도</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">얼마나 이용·참여했고, 얼마나 만족했는지 함께 확인</text><text x="55" y="253" font-size="18" fill="#607689" font-weight="400" text-anchor="start">이용·참여 응답 비율 = 유효 응답 수 ÷ 700명. 실제 출석·이용 기록이 아닌 설문 응답 기준입니다.</text><text x="55" y="297" font-size="19" fill="#16374d" font-weight="700" text-anchor="start">항목</text><text x="370" y="297" font-size="19" fill="#16374d" font-weight="700" text-anchor="start">이용·참여 응답 비율</text><text x="940" y="297" font-size="19" fill="#16374d" font-weight="700" text-anchor="start">평균 만족도 (1~5점)</text><text x="370.0" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">0%</text><text x="457.5" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">25%</text><text x="545.0" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">50%</text><text x="632.5" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">75%</text><text x="720.0" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">100%</text><text x="940" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="middle">1</text><text x="1025" y="330" font-size="14" fill="#607689" font-weight="400" text-anchor="mid