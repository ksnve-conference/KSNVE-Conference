<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">상세 분석 ② | 첫 참가자와 재참가자</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">첫 참가자와 기존 참가자의 경험 비교</text><text x="55" y="253" font-size="18" fill="#607689" font-weight="400" text-anchor="start">첫 참가 315명(45%) / 재참가 385명(55%). 참가 구분 및 응답 연결은 시연용 무작위 배정입니다.</text><rect x="55" y="290" width="610" height="155" rx="12" fill="#edf5fa"/><text x="80" y="327" font-size="24" fill="#16374d" font-weight="700" text-anchor="start">첫 참가 · 315명</text><text x="80" y="375" font-size="31" fill="#0674aa" font-weight="700" text-anchor="start">전반 만족도 4.18점</text><text x="80" y="414" font-size="19" fill="#607689" font-weight="400" text-anchor="start">전반 만족도 긍정 응답 81.9%</text><text x="55" y="494" font-size="22" fill="#16374d" font-weight="700" text-anchor="start">다음 학술대회 재참가 의향</text><text x="55" y="545" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">예</text><rect x="55" y="559" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="55" y="559" width="368.33333333333337" height="23" rx="4" fill="#0674aa"/><text x="665" y="578" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">86.7% · 273명</text><text x="55" y="625" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">아직 모르겠음</text><rect x="55" y="639" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="55" y="639" width="43.17460317460317" height="23" rx="4" fill="#0674aa"/><text x="665" y="658" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">10.2% · 32명</text><text x="55" y="705" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">아니오</text><rect x="55" y="719" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="55" y="719" width="13.492063492063492" height="23" rx="4" fill="#0674aa"/><text x="665" y="738" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">3.2% · 10명</text><rect x="735" y="290" width="610" height="155" rx="12" fill="#edf5fa"/><text x="760" y="327" font-size="24" fill="#16374d" font-weight="700" text-anchor="start">재참가 · 385명</text><text x="760" y="375" font-size="31" fill="#0674aa" font-weight="700" text-anchor="start">전반 만족도 4.22점</text><text x="760" y="414" font-size="19" fill="#607689" font-weight="400" text-anchor="start">전반 만족도 긍정 응답 87.5%</text><text x="735" y="494" font-size="22" fill="#16374d" font-weight="700" text-anchor="start">다음 학술대회 재참가 의향</text><text x="735" y="545" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">예</text><rect x="735" y="559" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="735" y="559" width="363.1818181818182" height="23" rx="4" fill="#0674aa"/><text x="1345" y="578" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">85.5% · 329명</text><text x="735" y="625" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">아직 모르겠음</text><rect x="735" y="639" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="735" y="639" width="49.675324675324674" height="23" rx="4" fill="#0674aa"/><text x="1345" y="658" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">11.7% · 45명</text><text x="735" y="705" font-size="19" fill="#16374d" font-weight="400" text-anchor="start">아니오</text><rect x="735" y="719" width="425" height="23" rx="4" fill="#edf2f6"/><rect x="735" y="719" width="12.142857142857142" height="23" rx="4" fill="#0674aa"/><text x="1345" y="738" font-size="20" fill="#16374d" font-weight="600" text-anchor="end">2.9% · 11명</text><rect x="55" y="789" width="1290" height="124" rx="12" fill="#f3f7fa"/><text x="75" y="824" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">활용: 첫 참가자의 만족도·재참가 의향이 낮다면 첫 방문 안내, 교류 기회, 프로그램 접근성을 검토합니다.</text><text x="75" y="857" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">이 그림의 집단 차이는 무작위 배정에 따른 예시입니다. 실제 차이가 확인되었다는 의미가 아닙니다.</text><text x="75" y="890" font-size="18" fill="#16374d" font-weight="400" text-anchor="start">전체 재참가 의향 ‘예’는 기존과 동일한 602명(86%)입니다.</text></g></svg>