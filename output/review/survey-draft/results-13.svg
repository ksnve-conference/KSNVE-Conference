<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><g font-family="Apple SD Gothic Neo,AppleGothic,sans-serif"><text x="55" y="43" font-size="16" fill="#0674aa" font-weight="700" text-anchor="start">KSNVE 2026  /  참가 만족도 설문</text><text x="55" y="94" font-size="34" fill="#16374d" font-weight="700" text-anchor="start">상세 분석 ① | 참가 유형별 평가</text><rect x="55" y="116" width="1290" height="3" rx="0" fill="#0674aa"/><rect x="55" y="136" width="1290" height="42" rx="8" fill="#fff3d6"/><text x="73" y="163" font-size="17" fill="#7c5c21" font-weight="400" text-anchor="start">가상 응답 700명 · 응답은 예시 분포 · 실제 조사 결과 또는 예측치가 아닙니다.</text><text x="55" y="220" font-size="24" fill="#0674aa" font-weight="700" text-anchor="start">학생·학계·연구계·산업계의 학술 프로그램 평가 비교</text><text x="55" y="253" font-size="17" fill="#607689" font-weight="400" text-anchor="start">기존 전체 점수 분포를 유지해 개인별 응답을 무작위 배정했습니다. 집단 차이는 시연용이며 실제 특성을 뜻하지 않습니다.</text><text x="55" y="305" font-size="19" fill="#16374d" font-weight="700" text-anchor="start">항목 / 5점 평균</text><text x="480" y="304" font-size="21" fill="#16374d" font-weight="700" text-anchor="middle">학생</text><text x="480" y="331" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">전체 n=336</text><text x="715" y="304" font-size="21" fill="#16374d" font-weight="700" text-anchor="middle">학계(비학생)</text><text x="715" y="331" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">전체 n=84</text><text x="950" y="304" font-size="21" fill="#16374d" font-weight="700" text-anchor="middle">연구계</text><text x="950" y="331" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">전체 n=105</text><text x="1185" y="304" font-size="21" fill="#16374d" font-weight="700" text-anchor="middle">산업계</text><text x="1185" y="331" font-size="16" fill="#607689" font-weight="400" text-anchor="middle">전체 n=175</text><text x="55" y="392" font-size="19" fill="#16374d" font-weight="400"