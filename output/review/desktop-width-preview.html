<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>데스크톱 목록 너비 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#162436;font-family:system-ui,sans-serif}header{padding:24px max(20px,calc((100vw - 1440px)/2));background:#fff;border-bottom:1px solid #d9e1ea}h1{font-size:23px;margin:0 0 10px}p{margin:8px 0;color:#536478;line-height:1.6}nav{display:flex;gap:8px;margin-top:16px}button{border:1px solid #b7cadb;padding:11px 18px;border-radius:9px;background:white;color:#12557d;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#076db0;color:white;border-color:#076db0}main{max-width:1440px;margin:auto}img{width:100%;height:auto;display:block}figcaption{padding:16px;font-weight:600}figure{margin:0}</style>
<header><h1>데스크톱 목록 너비 비교</h1><p>1,440px 화면 기준입니다. 글자 크기와 한 열 구성은 유지하고, 목록 영역만 760px에서 1,000px로 넓혔습니다.</p><p>제안은 1,200px 이상 화면의 목록에만 적용하는 안입니다. 모바일과 논문 본문 너비는 유지합니다. 실제 앱에는 아직 적용하지 않았습니다.</p><nav aria-label="너비 비교"><button aria-pressed="false" data-view="current">현재 · 760px</button><button aria-pressed="true" data-view="proposal">제안 · 1,000px</button></nav></header>
<main><figure><figcaption id="caption">제안 · 1,000px</figcaption><img id="preview" src="desktop-width-proposal.png" alt="제안된 넓은 데스크톱 통합검색 화면"></figure></main>
<script>const img=document.querySelector('#preview');document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));img.src='desktop-width-'+button.dataset.view+'.png';img.alt=button.textContent+' 통합검색 화면';document.querySelector('#caption').textContent=button.textContent;}));</script></html>
